<VirtualHost *:80>
    ServerName weshoot.net
    ServerAlias www.weshoot.net
    DocumentRoot /var/www/html/weshoot/frontend/dist
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =weshoot.net [OR]
    RewriteCond %{SERVER_NAME} =www.weshoot.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
<VirtualHost *:80>
    ServerName admin.weshoot.net
    DocumentRoot /var/www/html/weshoot/admin/dist
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{SERVER_NAME} =admin.weshoot.net
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>