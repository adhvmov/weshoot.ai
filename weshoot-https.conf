<VirtualHost *:443>
    ServerName weshoot.net
    ServerAlias www.weshoot.net
    DocumentRoot /var/www/html/weshoot/frontend/dist
    SSLEngine on
    # Update these paths with your actual certificate paths
    #SSLCertificateFile /etc/letsencrypt/live/weshoot.net/fullchain.pem
    #SSLCertificateKeyFile /etc/letsencrypt/live/weshoot.net/privkey.pem
    <Directory /var/www/html/weshoot/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # Handle SPA routing
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    # Backend API Proxy
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass /api http://localhost:5001/api
    ProxyPassReverse /api http://localhost:5001/api
    # Uploads directory proxy
    ProxyPass /uploads http://localhost:5001/uploads
    ProxyPassReverse /uploads http://localhost:5001/uploads
    ErrorLog ${APACHE_LOG_DIR}/weshoot_error.log
    CustomLog ${APACHE_LOG_DIR}/weshoot_access.log combined
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/weshoot.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/weshoot.net/privkey.pem
</VirtualHost>

<VirtualHost *:443>
    ServerName admin.weshoot.net
    DocumentRoot /var/www/html/weshoot/admin/dist
    SSLEngine on
    # Update these paths with your actual certificate paths
   # SSLCertificateFile /etc/letsencrypt/live/admin.weshoot.net/fullchain.pem
    #SSLCertificateKeyFile /etc/letsencrypt/live/admin.weshoot.net/privkey.pem
    <Directory /var/www/html/weshoot/admin/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # Handle SPA routing
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    # Note: The admin panel is configured to communicate with https://weshoot.net/api
    # via VITE_API_BASE_URL in .env.production
    ErrorLog ${APACHE_LOG_DIR}/admin_weshoot_error.log
    CustomLog ${APACHE_LOG_DIR}/admin_weshoot_access.log combined
Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/admin.weshoot.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/admin.weshoot.net/privkey.pem
</VirtualHost>
